<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SJInovacao.Acesso</title>
  <style>
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a5490 0%, #2c5f8d 100%);
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container { max-width: 900px; padding: 60px 40px; text-align: center; }
    h1 { font-size: 3em; margin-bottom: 10px; color: #fff; }
    .subtitle { font-size: 1.3em; opacity: 0.9; margin-bottom: 60px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 40px;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 35px 25px;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, background 0.2s;
    }
    .card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.2); }
    .card .icon { font-size: 3em; margin-bottom: 15px; }
    .card h2 { font-size: 1.4em; margin: 10px 0; color: #fff; }
    .card p { font-size: 0.95em; opacity: 0.85; margin: 0; }
    .footer { margin-top: 80px; opacity: 0.7; font-size: 0.9em; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #27ae60;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 SJInovacao.Acesso</h1>
    <div class="subtitle">Módulo de Acesso · <span class="badge">96% concluído</span></div>

    <div class="cards">
      <a href="./Dashboard.html" class="card">
        <div class="icon">📊</div>
        <h2>Dashboard de Testes</h2>
        <p>Histórico de execuções e cobertura</p>
      </a>

      <a href="./docs/" class="card">
        <div class="icon">📚</div>
        <h2>Documentação</h2>
        <p>Backlog, ADRs, arquitetura e API</p>
      </a>

      <a href="https://github.com/jesuino-treinamento/SJInovacao.Acesso" class="card">
        <div class="icon">💻</div>
        <h2>Repositório</h2>
        <p>Código-fonte no GitHub</p>
      </a>
    </div>

    <div class="footer">
      SJInovacao.Acesso · Módulo US01 · Última atualização: 10/10/2026
    </div>
  </div>
</body>
</html>
