name: .NET Tests Dashboard

on:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Compilar solução
        run: dotnet build --configuration Release --no-restore

      - name: Rodar InfraTests
        run: dotnet test SJInovacao.Acesso.InfraTests/SJInovacao.Acesso.InfraTests.csproj --configuration Release --no-build --logger "trx;LogFileName=InfraTests.trx"

      - name: Rodar ApplicationTests
        run: dotnet test SJInovacao.Acesso.ApplicationTests/SJInovacao.Acesso.ApplicationTests.csproj --configuration Release --no-build --logger "trx;LogFileName=ApplicationTests.trx"

      - name: Gerar histórico de testes
        run: pwsh ./Update-History.ps1 -TrxFolder ./ -HistoryFile ./TestResults/history.json

      - name: Gerar relatório HTML com gráficos
        run: pwsh ./Generate-TestReport.ps1 -TrxFolder ./TestResults -OutputHtml ./TestResults/Dashboard.html

      - name: Publicar relatório e histórico
        uses: actions/upload-artifact@v4
        with:
          name: TestReport
          path: TestResults
