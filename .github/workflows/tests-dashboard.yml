name: Testes Automatizados e Dashboard

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Instalar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar dependências
      run: dotnet restore ./src/SJInovacao.Acesso.sln

    - name: Executar script PowerShell (Update-History.ps1)
      run: pwsh -File .\TestResults\Update-History.ps1

    - name: Verificar se Dashboard foi gerado
      run: |
        if (-not (Test-Path "./TestResults/Dashboard.html")) {
          Write-Error "Dashboard.html não encontrado. Verifique o script de geração."
          exit 1
        }

    - name: Criar branch gh-pages se não existir
      run: |
        git fetch origin
        if (-not (git branch -r | Select-String "origin/gh-pages")) {
          git checkout --orphan gh-pages
          git rm -rf .
          echo "Branch gh-pages criada automaticamente." > index.html
          git add index.html
          git commit -m "Inicialização da branch gh-pages"
          git push origin gh-pages
          git checkout main
        }

    - name: Copiar Dashboard para index.html
      run: |
        Copy-Item -Path "./TestResults/Dashboard.html" -Destination "./TestResults/index.html" -Force

    - name: Publicar Dashboard no GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./TestResults