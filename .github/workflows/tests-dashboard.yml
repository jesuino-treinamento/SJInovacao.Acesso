name: Testes Automatizados e Dashboard

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    # =========================
    # 1. BUILD + TESTES
    # =========================
    - name: Instalar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restaurar dependências
      run: dotnet restore ./SJInovacao.Acesso.slnx

    - name: Executar Testes
      run: |
        dotnet test src/Tests/SJInovacao.Acesso.InfraTests/SJInovacao.Acesso.InfraTests.csproj --logger "trx;LogFileName=InfraTests.trx" --results-directory ./TestResults || true
        dotnet test src/Tests/SJInovacao.Acesso.ApplicationTests/SJInovacao.Acesso.ApplicationTests.csproj --logger "trx;LogFileName=ApplicationTests.trx" --results-directory ./TestResults || true
        dotnet test src/Tests/SJInovacao.Acesso.IntegrationTests/SJInovacao.Acesso.IntegrationTests.csproj --logger "trx;LogFileName=IntegrationTests.trx" --results-directory ./TestResults || true
        dotnet test src/Tests/SJInovacao.Acesso.UnitTests/SJInovacao.Acesso.UnitTests.csproj --logger "trx;LogFileName=UnitTests.trx" --results-directory ./TestResults || true
    - name: Listar TestResults (debug)
      run: ls -la ./TestResults/

    # =========================
    # 2. DASHBOARD
    # =========================
    - name: Atualizar histórico
      shell: pwsh
      run: pwsh -File ./scripts/Update-History.ps1

    - name: Gerar Dashboard
      shell: pwsh
      run: pwsh -File ./scripts/Generate-TestReport.ps1

    - name: Verificar Dashboard gerado
      run: |
        if [ ! -f "./TestResults/Dashboard.html" ]; then
          echo "❌ Dashboard.html não foi gerado"
          exit 1
        fi
        echo "✅ Dashboard.html OK"
    # =========================
    # 3. MKDOCS
    # =========================
    - name: Instalar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar MkDocs
      run: pip install -r requirements.txt

    - name: Gerar site de documentação
      run: mkdocs build --site-dir ./deploy/docs

    # =========================
    # 4. PREPARAR DEPLOY
    # =========================
    - name: Preparar pasta de deploy
      run: |
        mkdir -p deploy
        cp ./index.html ./deploy/index.html
        cp ./TestResults/Dashboard.html ./deploy/Dashboard.html
        cp ./TestResults/history.json ./deploy/history.json
        echo "--- Conteúdo de deploy: ---"
        ls -la ./deploy/
    # =========================
    # 5. PUBLICAR
    # =========================
    - name: Publicar no GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        force_orphan: true
        enable_jekyll: false