name: Testes Automatizados e Dashboard

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Instalar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar dependências
      run: dotnet restore ./SJInovacao.Acesso.slnx

    # ESTA ETAPA É CRUCIAL! Ela gera os arquivos .trx que o Dashboard precisa
    - name: Executar Testes (dotnet test)
      run: dotnet test ./SJInovacao.Acesso.slnx --no-restore --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults

    - name: Executar script PowerShell (Update-History.ps1)
      run: pwsh -File .\scripts\Update-History.ps1

    - name: Gerar Dashboard (Generate-TestReport.ps1)
      run: pwsh -File .\scripts\Generate-TestReport.ps1

    - name: Verificar se Dashboard foi gerado
      run: |
        if (-not (Test-Path "./TestResults/Dashboard.html")) {
          Write-Error "Dashboard.html não encontrado."
          exit 1
        }

    - name: Copiar Dashboard para index.html
      run: |
        Copy-Item -Path "./TestResults/Dashboard.html" -Destination "./TestResults/index.html" -Force

    - name: Publicar Dashboard no GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./TestResults
        force_orphan: true
        enable_jekyll: false