version: '3.8'

services:
  # Banco de dados PostgreSQL
  database:
    image: postgres:13
    container_name: sjinovacao_developer_evaluation_database
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sjinovacao_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  silverj_developer_evaluation_cache:
    image: redis:7-alpine
    container_name: silverj_developer_evaluation_cache
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sjinovacao_network

  # API
  sjinovacao.acesso.webapi:
    image: sjinovacaoacessowebapi
    build:
      context: .
      dockerfile: src/SJInovacao.Acesso.WebAPI/Dockerfile
    container_name: sjinovacao_acesso_api
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      # - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_ENVIRONMENT=Development
      - AllowedHosts=*
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - SwaggerAuth__Username=${SwaggerAuth__Username}
      - SwaggerAuth__Password=${SwaggerAuth__Password}
    depends_on:
      database:
        condition: service_healthy 
      silverj_developer_evaluation_cache:
        condition: service_started
    restart: unless-stopped
    networks:
      - sjinovacao_network

volumes:
  postgres_data:
  redis_data:

networks:
  sjinovacao_network:
    driver: bridge